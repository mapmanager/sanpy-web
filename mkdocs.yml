site_name: SanPy Web
site_description: Documentation for the SanPy Web static viewer for SanPy Zarr collections.
site_url: https://mapmanager.github.io/sanpy-web/docs/
repo_url: https://github.com/mapmanager/sanpy-web
repo_name: mapmanager/sanpy-web
docs_dir: docs
site_dir: dist/docs

nav:
  - Home: index.md
  - User guide:
      - Overview: user-guide/index.md
      - Opening data: user-guide/opening-data.md
  - Technical information:
      - Overview: technical/index.md
      - Development: technical/development.md
      - SanPy Zarr contract: technical/sanpy-zarr-contract.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
