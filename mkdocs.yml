site_name: SanPy Web
site_description: Documentation for the SanPy Web static viewer for SanPy Zarr collections.
site_url: https://mapmanager.github.io/sanpy-web/docs/
repo_url: https://github.com/mapmanager/sanpy-web
repo_name: mapmanager/sanpy-web
docs_dir: docs
site_dir: dist/docs

nav:
  - Welcome to SanPy Web: index.md
  - Technical information:
      - Overview: technical/index.md
      - Development: technical/development.md

theme:
  name: material
  logo: assets/sanpy-transparent.png
  favicon: assets/sanpy-transparent.png
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
