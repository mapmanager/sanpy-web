name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SanPy Web
        uses: actions/checkout@v6
        with:
          path: sanpy-web

      - name: Check out shared web components
        uses: actions/checkout@v6
        with:
          repository: mapmanager/mapmanager-web-components
          ref: main
          path: mapmanager-web-components

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sanpy-web/package-lock.json
            mapmanager-web-components/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sanpy-web/requirements-docs.txt

      - name: Install shared component dependencies
        run: npm ci
        working-directory: mapmanager-web-components

      - name: Build shared component packages
        run: npm run build --workspace @mapmanager/nicepool --workspace @mapmanager/signal-viewer
        working-directory: mapmanager-web-components

      - name: Install application dependencies
        run: npm ci
        working-directory: sanpy-web

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
        working-directory: sanpy-web

      - name: Verify and build production site
        run: npm run check
        working-directory: sanpy-web

      - name: Build documentation
        run: python -m mkdocs build --strict
        working-directory: sanpy-web

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: sanpy-web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
